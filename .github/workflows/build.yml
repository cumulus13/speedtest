name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Native x86_64 Linux builds (no cross/docker needed - fast path)
  build-linux:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: |
            x86_64-unknown-linux-gnu
            x86_64-unknown-linux-musl

      - name: Install musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools perl make

      - name: Build glibc
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Build musl
        run: cargo build --release --target x86_64-unknown-linux-musl
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC: musl-gcc

      - name: Rename and prepare assets
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/speedtest dist/speedtest-linux-x86_64
          cp target/x86_64-unknown-linux-musl/release/speedtest dist/speedtest-linux-x86_64-musl
          chmod +x dist/speedtest-linux-x86_64 dist/speedtest-linux-x86_64-musl
          strip dist/speedtest-linux-x86_64 dist/speedtest-linux-x86_64-musl 2>/dev/null || true

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          files: |
            dist/speedtest-linux-x86_64
            dist/speedtest-linux-x86_64-musl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Foreign-arch Linux builds via `cross` (uses Docker images with the right
  # linker/sysroot preinstalled, avoids hand-rolling CC_<target> env vars).
  build-linux-cross:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            asset: speedtest-linux-aarch64
          - target: aarch64-unknown-linux-musl
            asset: speedtest-linux-aarch64-musl
          - target: armv7-unknown-linux-gnueabihf
            asset: speedtest-linux-armv7
          - target: armv7-unknown-linux-musleabihf
            asset: speedtest-linux-armv7-musl
          - target: i686-unknown-linux-gnu
            asset: speedtest-linux-i686
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        run: cross build --release --target ${{ matrix.target }}

      - name: Rename and prepare assets
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/speedtest dist/${{ matrix.asset }}
          chmod +x dist/${{ matrix.asset }}
          strip dist/${{ matrix.asset }} 2>/dev/null || true

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          files: dist/${{ matrix.asset }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Android / Termux builds via `cross` (Android NDK toolchains inside the
  # cross Docker images). These binaries also run directly under Termux,
  # since Termux uses the same Bionic ABI/triples as the Android NDK.
  build-android:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            asset: speedtest-android-aarch64
          - target: armv7-linux-androideabi
            asset: speedtest-android-armv7
          - target: i686-linux-android
            asset: speedtest-android-i686
          - target: x86_64-linux-android
            asset: speedtest-android-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        run: cross build --release --target ${{ matrix.target }}

      - name: Rename and prepare assets
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/speedtest dist/${{ matrix.asset }}
          chmod +x dist/${{ matrix.asset }}
          strip dist/${{ matrix.asset }} 2>/dev/null || true

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          files: dist/${{ matrix.asset }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Best-effort: FreeBSD via cross. Not covered by any automated test beyond
  # "it compiles" - flag any failures here rather than assuming it's fine.
  build-freebsd:
    needs: release
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        run: cross build --release --target x86_64-unknown-freebsd

      - name: Rename and prepare assets
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-freebsd/release/speedtest dist/speedtest-freebsd-x86_64
          chmod +x dist/speedtest-freebsd-x86_64

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          files: dist/speedtest-freebsd-x86_64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build
        run: cargo build --release

      - name: Rename and prepare assets
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/speedtest.exe dist/speedtest-windows-x86_64.exe

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          files: dist/speedtest-windows-x86_64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Best-effort: Windows on ARM64. windows-latest carries the MSVC ARM64
  # toolchain, so this cross-compiles natively without a separate cross
  # tool - but it's untested here, flag failures rather than assuming.
  build-windows-arm64:
    needs: release
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-pc-windows-msvc

      - name: Build
        run: cargo build --release --target aarch64-pc-windows-msvc

      - name: Rename and prepare assets
        shell: bash
        run: |
          mkdir -p dist
          cp target/aarch64-pc-windows-msvc/release/speedtest.exe dist/speedtest-windows-aarch64.exe

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          files: dist/speedtest-windows-aarch64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: |
            x86_64-apple-darwin
            aarch64-apple-darwin

      - name: Build Intel
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build Apple Silicon
        run: cargo build --release --target aarch64-apple-darwin

      - name: Rename and prepare assets
        run: |
          mkdir -p dist
          cp target/x86_64-apple-darwin/release/speedtest dist/speedtest-macos-x86_64
          cp target/aarch64-apple-darwin/release/speedtest dist/speedtest-macos-aarch64
          chmod +x dist/speedtest-macos-x86_64 dist/speedtest-macos-aarch64
          strip dist/speedtest-macos-x86_64 dist/speedtest-macos-aarch64 2>/dev/null || true

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          files: |
            dist/speedtest-macos-x86_64
            dist/speedtest-macos-aarch64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crate:
    name: Publish to crates.io
    needs: build-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Publish to crates.io
      run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      continue-on-error: true
